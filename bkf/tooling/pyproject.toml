[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bkf-tooling"
version = "0.1.0"
description = "Command-line tools for validating and maintaining BKF bundles"
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "markdown-it-py>=3.0,<4.0",
    "jsonschema>=4.21,<5.0",
]

[project.scripts]
bkf = "bkf_cli:main"

[tool.setuptools]
py-modules = [
    "agent_modes",
    "audit",
    "bkf_cli",
    "bkf_hooks",
    "bkf_common",
    "bkf_launch",
    "bkf_merge",
    "bkf_mv",
    "bkf_relink",
    "bkf_upgrade",
    "bkf_sources",
    "bkf_task",
    "generate_inventory",
    "hook_events",
    "git_guard",
    "launch_guard",
    "log_entry",
    "merge_git",
    "merge_store",
    "navigation_map",
    "orient",
    "read_guard",
    "relink",
    "session_number",
    "updates",
    "search",
    "source_hooks",
    "source_page",
    "source_record",
    "source_store",
    "task_hook",
    "task_session",
    "task_store",
    "task_tmux",
    "task_worktree",
    "skill_catalog_common",
    "generate_skill_catalog",
    "validate_skill_catalog",
    "skills",
    "validate_bundle",
]
