[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bkf-tooling"
version = "0.1.0"
description = "Command-line tools for validating and maintaining BKF bundles"
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "markdown-it-py>=3.0,<4.0",
    "jsonschema>=4.21,<5.0",
]

[project.scripts]
bkf = "bkf_cli:main"

[tool.setuptools]
py-modules = [
    "agent_modes",
    "audit",
    "bkf_cli",
    "bkf_hooks",
    "bkf_common",
    "generate_inventory",
    "hook_events",
    "log_entry",
    "orient",
    "read_guard",
    "updates",
    "search",
    "skill_catalog_common",
    "generate_skill_catalog",
    "validate_skill_catalog",
    "skills",
    "validate_bundle",
]
