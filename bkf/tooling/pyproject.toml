[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bkf-tooling"
version = "0.1.0"
description = "Command-line tools for validating and maintaining BKF bundles"
requires-python = ">=3.10"
dependencies = [
    "ruamel.yaml>=0.18,<0.19",
    "markdown-it-py>=3.0,<4.0",
]

[project.scripts]
bkf = "bkf_cli:main"

[tool.setuptools]
py-modules = [
    "agent_modes",
    "bkf_cli",
    "bkf_hooks",
    "bkf_common",
    "generate_inventory",
    "hook_events",
    "log_entry",
    "orient",
    "search",
    "validate_bundle",
    "workflow_declaration",
    "workflow_declaration_checks",
    "workflow_files",
    "workflow_ids",
    "workflow_scaffold",
    "workflow_sync",
    "workflow_validation",
]
